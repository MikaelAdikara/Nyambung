name: nyambung
description: "Nyambung: papan AAC berbahasa Indonesia, pendamping harian orang tua, jembatan ke terapis."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

# Versi dikunci persis (tanpa ^). Paket baru hanya lewat jalur 1.
dependencies:
  flutter:
    sdk: flutter
  sqflite: 2.4.4
  path_provider: 2.1.6
  path: 1.9.1
  shared_preferences: 2.5.5
  flutter_tts: 4.2.5
  audioplayers: 6.8.1
  record: 7.1.1
  http: 1.6.0
  uuid: 4.6.0
  share_plus: 13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/vocab/
    - assets/symbols/png/
    - assets/symbols/custom/
    - assets/audio/core/
